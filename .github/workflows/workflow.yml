
name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo \
            --report-format sarif \
            --report-path /repo/reports/gitleaks.sarif || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/


  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Configure Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --sarif \
            -o reports/semgrep.sarif || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/


  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Trivy
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            aquasec/trivy:latest \
            fs --format sarif \
            -o /repo/reports/trivy.sarif /repo || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/


  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create reports directory
        run: mkdir -p reports

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit -r . \
            -f json \
            -o reports/bandit.json \
            --exit-zero \
            -x ./.venv,./tests,./node_modules

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/
